<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1530" viewBox="0 0 1440 1530" role="img" aria-labelledby="title desc">
  <title id="title">Як працює Tempo: від введення задач до готового розкладу</title>
  <desc id="desc">Фронтенд у браузері обмінюється даними з Python-балансером. Балансер обирає один із двох Express API. Обидва API та Python-воркери використовують спільну PostgreSQL. Воркер бере розрахунок із черги та запускає оптимізатор у дочірньому процесі. Autoscaler визначає потрібну кількість воркерів, а Supervisor запускає та зупиняє резервні процеси. У локальному запуску всі компоненти працюють на одному комп’ютері.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#527367" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="control-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#897344" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#193c32}
      .heading{font-size:34px;font-weight:700}
      .title{font-size:28px;font-weight:650}
      .body{font-size:21px}
      .note{font-size:18px;fill:#526c60}
      .small{font-size:17px;fill:#526c60}
      .card{fill:#fff;stroke:#c7d7ce;stroke-width:1.5}
      .data{fill:none;stroke:#527367;stroke-width:2.2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .control{fill:none;stroke:#897344;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#control-arrow)}
    </style>
  </defs>
  <rect width="1440" height="1530" rx="28" fill="#f4f6ef"/>
  <text x="80" y="57" class="heading">Tempo · архітектура системи</text>
  <text x="80" y="88" class="body" fill="#526c60">Як запит проходить від браузера до готового розкладу</text>

  <rect x="220" y="120" width="1000" height="160" rx="20" class="card"/>
  <text x="250" y="161" class="title">Фронтенд у браузері</text>
  <text x="1190" y="160" text-anchor="end" class="note">HTML · CSS · JavaScript</text>
  <text x="250" y="204" class="body">Введення задач, виконавців і дедлайнів</text>
  <text x="250" y="239" class="body">Прогрес, діаграма Ганта та історія</text>
  <rect x="840" y="184" width="350" height="67" rx="12" fill="#edf3e9"/>
  <text x="860" y="211" font-size="21" font-weight="600">Панель адміністратора</text>
  <text x="860" y="236" class="small">Черга, стан вузлів, CPU й пам’ять</text>

  <path d="M720 282V353" class="data"/>
  <text x="750" y="310" class="note">Запити HTTP / HTTPS</text>
  <text x="750" y="335" class="note">Відповіді та прогрес через SSE</text>

  <rect x="460" y="355" width="520" height="145" rx="20" fill="#193c32"/>
  <text x="720" y="394" text-anchor="middle" class="title" style="fill:#fff">Python-балансер</text>
  <text x="720" y="426" text-anchor="middle" class="body" style="fill:#e5efd9">least_conn · вибір менш зайнятого API</text>
  <text x="720" y="459" text-anchor="middle" class="note" style="fill:#d6e4da">Один вхід: HTTP 8088 · HTTPS 8443</text>
  <text x="720" y="483" text-anchor="middle" class="small" style="fill:#d6e4da">Передає запити й потокові відповіді</text>

  <path d="M590 502V535H440V573" class="data"/>
  <path d="M850 502V535H1000V573" class="data"/>
  <text x="720" y="557" text-anchor="middle" class="small">Два екземпляри одного API</text>

  <rect x="220" y="575" width="440" height="185" rx="20" class="card"/>
  <text x="250" y="614" class="title">API_1 · порт 3101</text>
  <text x="250" y="646" class="body">Node.js + Express</text>
  <text x="250" y="680" class="note">Вхід і перевірка параметрів</text>
  <text x="250" y="707" class="note">Створення розрахунків у черзі</text>
  <text x="250" y="734" class="note">Прогрес, історія та результати</text>
  <rect x="780" y="575" width="440" height="185" rx="20" class="card"/>
  <text x="810" y="614" class="title">API_2 · порт 3102</text>
  <text x="810" y="646" class="body">Node.js + Express</text>
  <text x="810" y="680" class="note">Вхід і перевірка параметрів</text>
  <text x="810" y="707" class="note">Створення розрахунків у черзі</text>
  <text x="810" y="734" class="note">Прогрес, історія та результати</text>

  <path d="M440 762V848" class="data"/>
  <path d="M1000 762V848" class="data"/>
  <text x="463" y="808" class="note">Запис і читання даних</text>
  <text x="1023" y="808" class="note">Спільна база</text>

  <rect x="220" y="850" width="1000" height="225" rx="22" fill="#e1edc9" stroke="#b4c99a" stroke-width="1.5"/>
  <text x="720" y="892" text-anchor="middle" class="title">PostgreSQL · дані та черга розрахунків</text>
  <text x="720" y="925" text-anchor="middle" class="note">Обидва API й усі воркери працюють з однією базою</text>
  <rect x="250" y="948" width="185" height="99" rx="12" fill="#f8fbf2"/>
  <text x="342" y="977" text-anchor="middle" font-size="23" font-weight="600">users</text>
  <text x="342" y="1004" text-anchor="middle" class="small">Користувачі</text>
  <text x="342" y="1027" text-anchor="middle" class="small">та їхні ролі</text>
  <rect x="455" y="948" width="315" height="99" rx="12" fill="#fff"/>
  <text x="612" y="977" text-anchor="middle" font-size="23" font-weight="600">jobs · черга</text>
  <text x="612" y="1004" text-anchor="middle" class="small">Ввід, статус і прогрес</text>
  <text x="612" y="1027" text-anchor="middle" class="small">Результати та історія розрахунків</text>
  <rect x="790" y="948" width="185" height="99" rx="12" fill="#f8fbf2"/>
  <text x="882" y="977" text-anchor="middle" font-size="23" font-weight="600">nodes</text>
  <text x="882" y="1004" text-anchor="middle" class="small">Стан вузлів</text>
  <text x="882" y="1027" text-anchor="middle" class="small">CPU й пам’ять</text>
  <rect x="995" y="948" width="195" height="99" rx="12" fill="#f8fbf2"/>
  <text x="1092" y="977" text-anchor="middle" font-size="23" font-weight="600">settings</text>
  <text x="1092" y="1004" text-anchor="middle" class="small">Потрібна кількість</text>
  <text x="1092" y="1027" text-anchor="middle" class="small">воркерів</text>

  <path d="M315 1077V1178" class="data"/>
  <text x="338" y="1115" class="note">Бере розрахунок із черги</text>
  <text x="338" y="1142" class="note">Записує прогрес і результат</text>
  <path d="M1140 1077V1124H1220V1168" class="data"/>
  <rect x="1010" y="1092" width="270" height="35" rx="8" fill="#f4f6ef"/>
  <text x="1145" y="1116" text-anchor="middle" class="note">Читає чергу й налаштування</text>

  <rect x="100" y="1180" width="430" height="175" rx="20" class="card"/>
  <text x="130" y="1218" class="title">Python-воркери</text>
  <text x="130" y="1255" font-size="23" font-weight="600">WORKER_1 · WORKER_2</text>
  <text x="130" y="1281" class="note">Працюють постійно</text>
  <text x="130" y="1314" font-size="23" font-weight="600">WORKER_3 · WORKER_4</text>
  <text x="130" y="1340" class="note">Запускаються за потреби · всього 2–4</text>
  <path d="M532 1267H618" class="data"/>
  <text x="575" y="1234" text-anchor="middle" class="small">Дані</text>
  <text x="575" y="1300" text-anchor="middle" class="small">Прогрес</text>

  <rect x="620" y="1180" width="360" height="175" rx="20" fill="#eaf2e9" stroke="#c7d7ce" stroke-width="1.5"/>
  <text x="650" y="1218" font-size="27" font-weight="650">Python-оптимізатор</text>
  <text x="650" y="1254" font-size="20">Окремий дочірній процес</text>
  <text x="650" y="1287" class="note">Шукає кращий порядок задач</text>
  <text x="650" y="1314" class="note">Враховує ресурси й залежності</text>
  <text x="650" y="1340" class="note">Зменшує час і запізнення</text>

  <rect x="1070" y="1170" width="300" height="205" rx="20" fill="#f5f0e1" stroke="#d4c7a5" stroke-width="1.5"/>
  <text x="1094" y="1209" font-size="24" font-weight="650">Керування воркерами</text>
  <text x="1094" y="1245" font-size="23" font-weight="600">Autoscaler</text>
  <text x="1094" y="1271" class="small">Визначає потрібну кількість</text>
  <text x="1094" y="1307" font-size="23" font-weight="600">Supervisor</text>
  <text x="1094" y="1333" class="small">Запускає та зупиняє резерв</text>
  <text x="1094" y="1358" class="small">Максимум — чотири воркери</text>
  <path d="M1220 1377V1435H315V1357" class="control"/>
  <text x="770" y="1414" text-anchor="middle" font-size="19" fill="#79653a">Керування резервними воркерами</text>

  <text x="80" y="1480" class="note">Суцільні стрілки — обмін даними. Пунктир — запуск і зупинка резерву.</text>
  <text x="80" y="1507" class="small">Локальний запуск: окремі процеси на одному комп’ютері. Черга зберігається тільки в PostgreSQL.</text>
</svg>
